name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest numpy

      - name: Build and install extension
        run: |
          maturin build --release --features extension-module --out dist
          pip install dist/*.whl

      - name: Rust unit tests
        run: cargo test --no-default-features

      - name: Python tests
        run: pytest -q

      - name: Stability equivalence report
        run: python scripts/verify_stability.py --output stability_cross_validation_report.json

      - name: Upload equivalence report
        uses: actions/upload-artifact@v4
        with:
          name: stability-report-py${{ matrix.python-version }}
          path: stability_cross_validation_report.json
